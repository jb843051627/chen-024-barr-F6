<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('联户验收签认单')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <!-- 在签张数与逐口点数、移交名册同出 /board 一趟计算：随带单加一、随签讫减一 -->
        <table class="layui-table" style="margin:0;">
            <thead>
            <tr><th style="width:220px;">在签张数（总）</th><th>停在各口</th><th style="width:160px;">已签讫张数</th></tr>
            </thead>
            <tbody>
            <tr>
                <td><span id="running-total" class="layui-badge layui-bg-orange" style="font-size:15px;"></span></td>
                <td id="at-node" style="line-height:30px;"></td>
                <td><span id="finished-total" class="layui-badge layui-bg-black"></span></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="layui-card">
    <div class="layui-card-header">
        移交名册（第三口结论与名册出自同一回计算，一处取数，没有手填）
    </div>
    <div class="layui-card-body">
        <table class="layui-table" style="margin:0;">
            <thead>
            <tr>
                <th>签认单号</th><th>受理簿记录号</th><th>楼组片号</th><th>所在街</th><th>合验户数</th>
                <th>第三口结论</th><th>签讫时刻</th>
            </tr>
            </thead>
            <tbody id="roster-body">
            <tr><td colspan="7" style="color:#999;">加载中…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="layui-card">
    <div class="layui-card-body">
        <span class="layui-word-aux">签认单不在这里新建——一律由「当场验收记录」那一场关联带出；想看单/带单去受理簿台账。</span>
        <table id="bill-table" lay-filter="bill-table" style="margin-top:8px;"></table>
    </div>
</div>
</body>

<script type="text/html" id="bill-bar">
    <button shiro:hasPermission="barr:barrJointSign:view" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="openSign" title="打开签认单面"><i class="layui-icon layui-icon-edit"></i> 签认</button>
    <button shiro:hasPermission="barr:barrJointSign:audit" class="pear-btn pear-btn-sm" lay-event="audit" title="事后对受理簿"><i class="layui-icon layui-icon-auz"></i> 核对</button>
</script>

<script type="text/html" id="bill-status-tpl">
    {{# if(d.status==1){ }}
    <span class="layui-badge layui-bg-black">已签讫</span>
    {{# } else { }}
    <span class="layui-badge layui-bg-orange">在签·停第{{d.nodeNo+1}}口·第{{d.roundNo}}轮</span>
    {{# } }}
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'jquery'], function () {
        let table = layui.table;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/BarrJointSignController/";

        table.render({
            elem: '#bill-table',
            url: MODULE_PATH + 'list',
            page: true,
            method: 'get',
            limit: 10,
            limits: [10, 20, 50],
            skin: 'line',
            cols: [[
                {title: 'ID', field: 'id', hide: true},
                {title: '签认单号', field: 'billNo', width: 190},
                {title: '受理簿记录号', field: 'acceptNo', width: 180},
                {title: '楼组片号', field: 'groupNo', width: 140},
                {title: '所在街', field: 'streetName', width: 110},
                {title: '户数', field: 'siteCount', width: 70, align: 'center'},
                {title: '情形', field: 'status', width: 190, templet: '#bill-status-tpl'},
                {title: '签讫时刻', field: 'finishedTime', width: 170},
                {title: '操作', toolbar: '#bill-bar', width: 170, align: 'center', fixed: 'right'}
            ]],
            done: function () {
                loadBoard();
            }
        });

        function loadBoard() {
            $.get(MODULE_PATH + 'board', function (res) {
                if (res.code !== 200) {
                    return;
                }
                let d = res.data;
                $('#running-total').text(d.runningTotal + ' 张');
                let names = ['第1口·住户', '第2口·到场两方', '第3口·两级残联'];
                $('#at-node').html(d.atNode.map(function (n, i) {
                    return '<span class="layui-badge layui-bg-blue" style="margin-right:10px;">' + names[i] + '：' + n + ' 张</span>';
                }).join(''));
                $('#finished-total').text(d.finishedTotal + ' 张');
                let rows = d.roster || [];
                $('#roster-body').html(rows.length === 0
                    ? '<tr><td colspan="7" style="color:#999;">暂无签讫单</td></tr>'
                    : rows.map(function (r) {
                        return '<tr><td>' + r.billNo + '</td><td>' + r.acceptNo + '</td><td>' + r.groupNo
                            + '</td><td>' + (r.streetName || '') + '</td><td>' + (r.siteCount == null ? '' : r.siteCount)
                            + '</td><td><span class="layui-badge layui-bg-green">' + r.finalConclusion
                            + '</span></td><td>' + (r.finishedTime || '') + '</td></tr>';
                    }).join(''));
            });
        }

        table.on('tool(bill-table)', function (obj) {
            let d = obj.data;
            if (obj.event === 'openSign') {
                layer.open({
                    type: 2, title: '联户验收签认单·' + d.billNo, shade: 0.1, area: ['900px', '640px'],
                    content: MODULE_PATH + 'page/' + d.id
                });
            } else if (obj.event === 'audit') {
                $.get(MODULE_PATH + 'audit/' + d.id, function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg, {icon: 2});
                        return;
                    }
                    showAudit(res.data);
                });
            }
        });

        window.reloadBillTable = function () {
            table.reload('bill-table');
        };

        function showAudit(a) {
            let nodeNames = ['第1口', '第2口', '第3口'];
            // 回的明细是从第三口数回第一口，照样倒着摆
            let rows = a.nodes.map(function (n) {
                return '<tr><td>' + nodeNames[n.nodeNo] + '（' + n.nodeName + '）</td><td>' + n.needCount
                    + '</td><td>第' + n.finalRound + '轮 ' + n.finalValid + ' 笔</td><td>'
                    + (n.complete ? '<span class="layui-badge layui-bg-green">齐</span>'
                                   : '<span class="layui-badge">没齐</span>') + '</td></tr>';
            }).join('');
            let head = '<div style="margin-bottom:8px;">'
                + '受理簿：' + (a.ledgerFound ? '<span class="layui-badge layui-bg-green">翻得着 ' + a.acceptNo + '</span>'
                                               : '<span class="layui-badge">翻不着</span>')
                + '　逐口对簿：' + (a.matched ? '<span class="layui-badge layui-bg-green">笔笔合得拢</span>'
                                              : '<span class="layui-badge">合不拢</span>')
                + '　第三口结论：<b>' + (a.finalConclusion || '（未定案）') + '</b></div>';
            let problems = (a.problems && a.problems.length)
                ? '<div style="color:#FF5722;margin-top:8px;">' + a.problems.map(function (p) { return '· ' + p; }).join('<br>') + '</div>'
                : '';
            layer.open({
                type: 1, title: '逐口核对·' + a.billNo, area: ['720px', '480px'],
                content: head
                    + '<table class="layui-table"><thead><tr><th>口（从第三口数回第一口）</th><th>应签</th><th>定案轮算数笔</th><th>点齐</th></tr></thead><tbody>'
                    + rows + '</tbody></table>' + problems
            });
        }
    });
</script>
</html>
